# Host prerequisites of the HD model pipeline: what `tools/hdmodel doctor` checks and what
# docs/hd-model-reproduce.md installs. One list, read by both (the guide links here instead of copying it).
#
# Weights: `root` names the folder the path is relative to:
#   comfy  = $HDMODEL_COMFY_ROOT/models   (default ~/ai/ComfyUI/models)
#   omni   = $HUNYUAN_OMNI_ROOT/models    (default ~/ai/hunyuan3d-omni/models)
#   paint  = $HY3DPAINT_ROOT/models       (default ~/ai/hy3dpaint/models)
# `size` is in bytes (the fast check), `sha256` the file's digest (`doctor --full`). `url` is the download
# (Hugging Face `resolve/<revision>/<path>`, so the revision is part of it). For the HF files the sha256 equals the
# hub's LFS sha256 at that revision; the files that were on the host before the spike (Qwen-Image 2.1, FLUX.2
# Klein, SeedVR2, UltraSharpV2) were matched on 2026-10-16 against the then-current revision named here; the
# Klein repo is gated, so its sha256 is the local file's. `required: false` = only for an optional or dead-end
# path (`used_by` says which); doctor reports those as warnings, not failures.

versions:
  python_system_min: [3, 12]     # the tool itself (pilot: 3.14.7)
  python_venv: "3.12"            # Omni and Paint venvs (uv-managed CPython 3.12.14)
  blender: "5.2.1"
  comfyui: "0.38.0"              # https://github.com/Comfy-Org/ComfyUI @ 8cfe5e1ecb97512dea8deaac15e1228d7e6feeb1; every node is core
  torch: "2.14.1+cu130"
  gpu_vram_total_mib_min: 24576  # Paint 2.1 with 15 views at 512 px peaks at 22.5 GB; its gpu-run.sh waits for 24000 MiB free
  disk_free_gib_min: 10          # concept root: fail below
  disk_free_gib_warn: 30         # concept root: warn below (a monster writes 1-2 GB; the pilot root is 20 GB)
  ram_available_gib_min: 8       # the gpu-run.sh wrappers wait for 8 GB available

# The document to follow for a missing prerequisite, per doctor area (`doctor` prints it next to every FAIL/WARN).
# The generator installs' own INSTALL.md files live outside the repository (byte copies of their runners:
# tools/hdmodellib/host/); the reproduction guide copies their essentials.
docs:
  host: "docs/hd-model-reproduce.md §1.2 System packages"
  gpu: "docs/hd-model-reproduce.md §1.1 Hardware and OS, §2.5 Resource rules (GPU lock)"
  comfyui: "docs/hd-model-reproduce.md §1.4 ComfyUI and §1.6 ComfyUI's network namespace"
  weights: "docs/hd-model-reproduce.md §1.5 Weights (download commands; URL and sha256 in prereqs.yaml)"
  omni: "~/ai/hunyuan3d-omni/INSTALL.md; docs/hd-model-reproduce.md §1.7 Generator installs"
  paint: "~/ai/hy3dpaint/INSTALL.md; docs/hd-model-reproduce.md §1.7 Generator installs"
  repo: "docs/hd-model-reproduce.md §2 Repository side"

system_python_modules: [numpy, PIL, yaml, openvdb]
binaries: [ffmpeg, nvidia-smi, flock, curl, git]

installs:
  omni:
    label: Hunyuan3D-Omni
    env: HUNYUAN_OMNI_ROOT
    default: ~/ai/hunyuan3d-omni
    files: [.venv/bin/python, run_omni.py, gpu-run.sh]
    lock_env: OMNI_GPU_LOCK      # gpu-run.sh's lock file; tools/hdmodel passes its own (config.gpu_lock_path)
    upstream: {url: "https://github.com/Tencent-Hunyuan/Hunyuan3D-Omni", commit: 4d47c0cc2bd0c4281963a7314ab330a5af36bfa8}
    used_by: "stage 4 (Omni shape) and stage 7 (head candidates)"
  paint:
    label: Hunyuan3D-Paint 2.1
    env: HY3DPAINT_ROOT
    default: ~/ai/hy3dpaint
    files: [.venv/bin/python, paint.py, gpu-run.sh]
    lock_env: HY3DPAINT_GPU_LOCK
    upstream: {url: "https://github.com/Tencent-Hunyuan/Hunyuan3D-2.1", commit: 82920d643c0dc2f7bfd7255f45f62d386edfe60c}
    imports: [custom_rasterizer, xatlas]
    built: ["upstream/hy3dpaint/DifferentiableRenderer/mesh_inpaint_processor*.so"]
    used_by: "stage 6 (Paint 2.1) and every UV atlas (xatlas, HDMODEL_XATLAS_PYTHON)"

# Pilot files that every monster's look stage reads from the repository (byte copies of the spike's, 2026-10-16).
pilot_files:
  - {path: tools/hdmodellib/pilot/calibration.json,
     used_by: "look stage: the preview calibration (client lighting)"}
  - {path: tools/hdmodellib/pilot/glb_max_texture.py,
     used_by: "look stage: the in-game copy"}

comfy_nodes:
  required:   # every class_type of tools/hdmodellib/workflows/{qwen,klein,seedvr2,upscale_model,qwen_ref,marigold_normals}.json + the TRELLIS.2 graph (shapes.py)
    [BasicGuider, CFGGuider, CLIPLoader, CLIPTextEncode, CLIPVisionLoader, ConditioningLoader, ConditioningZeroOut,
     DisableNoise, EmptyFlux2LatentImage, EmptyTrellis2LatentStructure, Flux2Scheduler, FluxKVCache,
     ImageUpscaleWithModel, KSampler, KSamplerSelect, LoadImage, LoraLoaderModelOnly, ManualSigmas,
     MarigoldV2PostProcess, ModelSamplingAuraFlow, ModelSamplingSD3, QwenImage21Cache, RandomNoise, ReferenceLatent,
     RescaleCFG, CFGOverride, ResizeImageMaskNode, SamplerCustomAdvanced, SaveImage, SaveGLB, SeedVR2Conditioning,
     SeedVR2PostProcessing, SeedVR2Preprocess, TextEncodeQwenImage21, Trellis2Conditioning, Trellis2ShapeStage,
     Trellis2TextureStage, Trellis2UpsampleStage, UNETLoader, UpscaleModelLoader, VAEDecode, VAEDecodeTiled,
     VAEEncode, VAEEncodeTiled, VAELoader, VaeDecodeShapeTrellis, VaeDecodeStructureTrellis2,
     VaeDecodeTextureTrellis, RemeshMesh, DecimateMesh, UnwrapMesh, BakeTextureFromVoxel, ApplyTextureToMesh]
  optional:   # depth filter (depth-moge, off by default) and the Pixal3D dead end
    [LoadMoGeModel, MoGeInference, MoGeRender, Pixal3DMultiViewConditioning]

